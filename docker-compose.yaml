services:
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    networks: [expensy-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "someredispassword"]
    networks: [expensy-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "someredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./expensy_backend
    image: expensy-backend:local
    environment:
      NODE_ENV: production
      PORT: "8706"
      DATABASE_URI: "mongodb://root:example@mongo:27017/expensy?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: someredispassword
    depends_on:
      mongo:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    networks: [expensy-net]

  frontend:
    build:
      context: ./expensy_frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    image: expensy-frontend:local
    depends_on: [backend]
    networks: [expensy-net]

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, backend]
    networks: [expensy-net]

volumes:
  mongo-data:

networks:
  expensy-net:
    driver: bridge
