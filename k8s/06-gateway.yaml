apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: expensy
data:
  nginx.conf: |
    events {}
    http {
      upstream frontend_upstream { server frontend:3000; }
      upstream backend_upstream  { server backend:8706; }
      server {
        listen 80;
        location /api/ {
          proxy_pass http://backend_upstream/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
          proxy_pass http://frontend_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: expensy
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap: { name: gateway-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: expensy
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 80
