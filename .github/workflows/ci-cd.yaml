name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC needs id-token: write; contents: read to checkout
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 686699774218.dkr.ecr.eu-central-1.amazonaws.com
  BACKEND_REPO: expensy-backend
  FRONTEND_REPO: expensy-frontend

jobs:
  # ---------- CI: build both apps, catch compile errors early ----------
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [expensy_backend, expensy_frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.service }}
        # frontend needs the public API var at build time; backend ignores it
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  # ---------- CD: build images, push to ECR (only on push to main) ----------
  docker-push:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const tok = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(tok.split('.')[1], 'base64').toString())
            core.info('SUB: ' + claims.sub)
            core.info('AUD: ' + claims.aud)
            core.info('REPO: ' + claims.repository)

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::686699774218:role/expensy-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./expensy_backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./expensy_frontend
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
